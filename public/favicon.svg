<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Tile with Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glowGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Gold Accent Badge Border -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="url(#bookGrad)" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Book Symbol Group -->
  <g filter="url(#shadow)" transform="translate(0, 8)">
    <!-- Book Spine / Backing -->
    <path d="M256 120 C200 96, 120 104, 72 128 L72 360 C120 336, 200 328, 256 352 C312 328, 392 336, 440 360 L440 128 C392 104, 312 96, 256 120 Z" fill="#b45309"/>
    
    <!-- Left Page -->
    <path d="M256 128 C204 106, 128 114, 80 136 L80 352 C128 330, 204 322, 256 344 Z" fill="url(#pageGrad)"/>
    
    <!-- Right Page -->
    <path d="M256 128 C308 106, 384 114, 432 136 L432 352 C384 330, 308 322, 256 344 Z" fill="url(#pageGrad)"/>

    <!-- Gold Edge Accent -->
    <path d="M80 136 C128 114, 204 106, 256 128 L256 136 C204 114, 128 122, 80 144 Z" fill="url(#bookGrad)"/>
    <path d="M432 136 C384 114, 308 106, 256 128 L256 136 C308 114, 384 122, 432 144 Z" fill="url(#bookGrad)"/>

    <!-- Left Page Decorative Lines (Lines of text) -->
    <line x1="112" y1="180" x2="224" y2="168" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="112" y1="216" x2="224" y2="204" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="112" y1="252" x2="200" y2="242" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="112" y1="288" x2="224" y2="276" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Right Page Decorative Lines -->
    <line x1="288" y1="168" x2="400" y2="180" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <line x1="288" y1="204" x2="400" y2="216" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="288" y1="242" x2="376" y2="252" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="288" y1="276" x2="400" y2="288" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

    <!-- Center Fold Divider -->
    <line x1="256" y1="128" x2="256" y2="344" stroke="#d97706" stroke-width="6"/>

    <!-- Bookmark Ribbon Hanging Down -->
    <path d="M256 128 L256 390 L276 370 L296 390 L296 132 Z" fill="url(#bookGrad)" filter="url(#goldGlow)"/>

    <!-- Small Golden Star Emblem above book -->
    <polygon points="256,60 263,78 282,80 268,93 272,112 256,102 240,112 244,93 230,80 249,78" fill="url(#bookGrad)" filter="url(#goldGlow)"/>
  </g>
</svg>
