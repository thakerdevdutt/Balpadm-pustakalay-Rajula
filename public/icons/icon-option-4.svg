<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Warm Background -->
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22252a"/>
      <stop offset="50%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>

    <!-- Warm Golden Flame/Sun Glow -->
    <radialGradient id="sunGlow4" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldTrim4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c98a3c"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="pageGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef7"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#edd9a6"/>
    </linearGradient>

    <filter id="glowFilter4" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>

    <clipPath id="squircleClip4">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad4)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sunGlow4)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#goldTrim4)" stroke-width="2" stroke-opacity="0.4"/>

  <g clip-path="url(#squircleClip4)">
    <!-- Standing Books in Background -->
    <g opacity="0.85">
      <!-- Book 1 (Left) -->
      <rect x="70" y="140" width="42" height="340" rx="4" fill="#3b2b1a"/>
      <rect x="76" y="148" width="30" height="12" fill="#d97706" opacity="0.6"/>
      <!-- Book 2 (Left-Mid) -->
      <rect x="120" y="110" width="50" height="370" rx="4" fill="#1e3a47"/>
      <line x1="120" y1="170" x2="170" y2="170" stroke="#f59e0b" stroke-width="2" opacity="0.5"/>
      <!-- Book 3 (Right-Mid) -->
      <rect x="342" y="110" width="52" height="370" rx="4" fill="#581c24"/>
      <line x1="342" y1="160" x2="394" y2="160" stroke="#fcd34d" stroke-width="2" opacity="0.6"/>
      <!-- Book 4 (Right) -->
      <rect x="402" y="130" width="44" height="350" rx="4" fill="#1b382b"/>
      <rect x="408" y="138" width="32" height="14" fill="#d97706" opacity="0.6"/>
    </g>

    <!-- Foreground Open Illuminated Book with Soft Glow -->
    <g filter="url(#glowFilter4)" transform="translate(0, 20)">
      <!-- Book Base Spine Cover -->
      <path d="M256 220 C210 190, 130 196, 75 220 L75 390 C130 366, 210 360, 256 384 C302 360, 382 366, 437 390 L437 220 C382 196, 302 190, 256 220 Z" fill="#854d0e"/>
      
      <!-- Open Left Page -->
      <path d="M256 226 C214 198, 138 206, 82 228 L82 380 C138 358, 214 350, 256 374 Z" fill="url(#pageGrad4)"/>
      <!-- Left Page Text Hint lines -->
      <line x1="110" y1="250" x2="225" y2="242" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="110" y1="270" x2="228" y2="262" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="110" y1="290" x2="220" y2="282" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="110" y1="310" x2="226" y2="302" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="110" y1="330" x2="190" y2="324" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

      <!-- Open Right Page -->
      <path d="M256 226 C298 198, 374 206, 430 228 L430 380 C374 358, 298 350, 256 374 Z" fill="url(#pageGrad4)"/>
      <!-- Right Page Text Hint lines -->
      <line x1="287" y1="242" x2="402" y2="250" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="284" y1="262" x2="402" y2="270" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="292" y1="282" x2="402" y2="290" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="286" y1="302" x2="402" y2="310" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <line x1="288" y1="324" x2="368" y2="330" stroke="#b45309" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

      <!-- Center Fold Shadow & Golden Bookmark Ribbon -->
      <line x1="256" y1="226" x2="256" y2="374" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
      <path d="M256 226 Q266 280 274 395 L264 388 L254 395 Q250 280 256 226" fill="#e11d48"/>
    </g>

    <!-- Warm Glowing Base Glow -->
    <ellipse cx="256" cy="480" rx="160" ry="25" fill="#f59e0b" opacity="0.25"/>
  </g>

  <!-- Top Glass Highlight -->
  <rect x="20" y="20" width="472" height="236" rx="104" fill="#ffffff" opacity="0.04"/>
</svg>
