<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Royal Slate -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232730"/>
      <stop offset="50%" stop-color="#15181e"/>
      <stop offset="100%" stop-color="#0b0d10"/>
    </linearGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldRib2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b47820"/>
      <stop offset="35%" stop-color="#fdd674"/>
      <stop offset="60%" stop-color="#ffeab4"/>
      <stop offset="85%" stop-color="#e0a334"/>
      <stop offset="100%" stop-color="#935b12"/>
    </linearGradient>

    <!-- Antique Leather: Ruby Wine -->
    <linearGradient id="leatherRuby" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54121a"/>
      <stop offset="30%" stop-color="#8a202c"/>
      <stop offset="70%" stop-color="#691621"/>
      <stop offset="100%" stop-color="#3c0b11"/>
    </linearGradient>

    <!-- Antique Leather: Navy Sapphire -->
    <linearGradient id="leatherNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#132338"/>
      <stop offset="30%" stop-color="#1e3a5f"/>
      <stop offset="70%" stop-color="#172e4c"/>
      <stop offset="100%" stop-color="#0b1420"/>
    </linearGradient>

    <!-- Antique Leather: Emerald Green -->
    <linearGradient id="leatherEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b20"/>
      <stop offset="30%" stop-color="#1a4735"/>
      <stop offset="70%" stop-color="#133829"/>
      <stop offset="100%" stop-color="#081a13"/>
    </linearGradient>

    <!-- Antique Leather: Cognac Amber -->
    <linearGradient id="leatherCognac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e3d16"/>
      <stop offset="30%" stop-color="#a45c22"/>
      <stop offset="70%" stop-color="#7d4417"/>
      <stop offset="100%" stop-color="#442209"/>
    </linearGradient>

    <filter id="spineShadow2" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-5" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <clipPath id="squircleClip2">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad2)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#373c46" stroke-width="2" stroke-opacity="0.5"/>

  <g clip-path="url(#squircleClip2)">
    <!-- Floor Shelf shadow -->
    <rect x="16" y="468" width="480" height="40" fill="#08090b"/>

    <!-- BOOK 1: Ruby Wine Leather (Left) -->
    <g filter="url(#spineShadow2)">
      <rect x="68" y="270" width="76" height="235" rx="6" fill="url(#leatherRuby)"/>
      <ellipse cx="106" cy="272" rx="36" ry="6" fill="#aa303e"/>
      <!-- Gold Spine Ribs (Raised bands) -->
      <path d="M72 315 L140 315" stroke="url(#goldRib2)" stroke-width="4"/>
      <path d="M72 321 L140 321" stroke="url(#goldRib2)" stroke-width="2"/>
      <path d="M72 390 L140 390" stroke="url(#goldRib2)" stroke-width="3"/>
      <path d="M72 455 L140 455" stroke="url(#goldRib2)" stroke-width="4"/>
      <path d="M72 461 L140 461" stroke="url(#goldRib2)" stroke-width="2"/>
      <!-- Gold Title Label Plaque -->
      <rect x="80" y="340" width="52" height="32" rx="3" fill="#1f0609" stroke="url(#goldRib2)" stroke-width="1.5"/>
      <line x1="86" y1="352" x2="126" y2="352" stroke="url(#goldRib2)" stroke-width="2"/>
      <line x1="90" y1="360" x2="122" y2="360" stroke="url(#goldRib2)" stroke-width="1.5"/>
    </g>

    <!-- BOOK 2: Cognac Amber Leather (Mid-Left) -->
    <g filter="url(#spineShadow2)">
      <rect x="148" y="210" width="80" height="295" rx="6" fill="url(#leatherCognac)"/>
      <ellipse cx="188" cy="212" rx="38" ry="6" fill="#bf702d"/>
      <!-- Gold Filigree and Bands -->
      <path d="M152 245 L224 245" stroke="url(#goldRib2)" stroke-width="4"/>
      <path d="M152 251 L224 251" stroke="url(#goldRib2)" stroke-width="2"/>
      <path d="M152 355 L224 355" stroke="url(#goldRib2)" stroke-width="3"/>
      <path d="M152 440 L224 440" stroke="url(#goldRib2)" stroke-width="4"/>
      <!-- Geometric Diamond Pattern -->
      <polygon points="188,285 198,300 188,315 178,300" fill="none" stroke="url(#goldRib2)" stroke-width="2"/>
      <circle cx="188" cy="300" r="3" fill="url(#goldRib2)"/>
    </g>

    <!-- BOOK 3: Navy Sapphire Leather (Mid-Right, Tall) -->
    <g filter="url(#spineShadow2)">
      <rect x="232" y="165" width="88" height="340" rx="7" fill="url(#leatherNavy)"/>
      <ellipse cx="276" cy="168" rx="42" ry="7" fill="#2d5284"/>
      <!-- Gold Embossed bands -->
      <path d="M236 198 L316 198" stroke="url(#goldRib2)" stroke-width="5"/>
      <path d="M236 205 L316 205" stroke="url(#goldRib2)" stroke-width="2"/>
      <path d="M236 320 L316 320" stroke="url(#goldRib2)" stroke-width="3"/>
      <path d="M236 430 L316 430" stroke="url(#goldRib2)" stroke-width="5"/>
      <path d="M236 437 L316 437" stroke="url(#goldRib2)" stroke-width="2"/>
      <!-- Shield Motif -->
      <path d="M264 245 L288 245 C288 270, 276 280, 276 285 C276 280, 264 270, 264 245 Z" fill="none" stroke="url(#goldRib2)" stroke-width="2"/>
      <!-- Silken Crimson Bookmark ribbon extending below -->
      <path d="M276 168 Q285 140 292 120 Q286 123 280 120 Q276 142 274 168" fill="#e11d48"/>
    </g>

    <!-- BOOK 4: Emerald Forest Leather (Far Right, Massive Volume) -->
    <g filter="url(#spineShadow2)">
      <rect x="324" y="180" width="112" height="325" rx="8" fill="url(#leatherEmerald)"/>
      <ellipse cx="380" cy="183" rx="54" ry="7" fill="#29694f"/>
      <!-- Heavy Gold Filigree & Classical Bands -->
      <path d="M330 215 L430 215" stroke="url(#goldRib2)" stroke-width="5"/>
      <path d="M330 223 L430 223" stroke="url(#goldRib2)" stroke-width="2"/>
      <path d="M330 330 L430 330" stroke="url(#goldRib2)" stroke-width="4"/>
      <path d="M330 440 L430 440" stroke="url(#goldRib2)" stroke-width="5"/>
      <!-- Classical Emblem -->
      <rect x="350" y="250" width="60" height="42" rx="4" fill="#091b13" stroke="url(#goldRib2)" stroke-width="2"/>
      <line x1="360" y1="265" x2="400" y2="265" stroke="url(#goldRib2)" stroke-width="2"/>
      <line x1="365" y1="275" x2="395" y2="275" stroke="url(#goldRib2)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Subtle Top Arch Glass Highlight -->
  <rect x="20" y="20" width="472" height="236" rx="104" fill="#ffffff" opacity="0.04"/>
</svg>
