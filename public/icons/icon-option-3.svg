<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="50%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>

    <!-- Warm Golden Light at center bottom -->
    <radialGradient id="centerGlow3" cx="50%" cy="85%" r="65%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Vibrant Modern Book Colors -->
    <linearGradient id="mBook1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="mBook2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="mBook3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>

    <linearGradient id="mBook4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="mBook5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <linearGradient id="mPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <filter id="mShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <clipPath id="squircleClip3">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad3)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#centerGlow3)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#2a2e38" stroke-width="2"/>

  <g clip-path="url(#squircleClip3)">
    <!-- Minimalist Library Composition -->
    <g filter="url(#mShadow)">
      <!-- Book 1 (Amber, Angle tilt) -->
      <g transform="translate(65, 330)">
        <rect x="0" y="0" width="55" height="175" rx="5" fill="url(#mBook1)"/>
        <rect x="8" y="18" width="4" height="120" rx="2" fill="#ffffff" opacity="0.3"/>
      </g>

      <!-- Book 2 (Emerald) -->
      <g transform="translate(130, 270)">
        <rect x="0" y="0" width="60" height="235" rx="6" fill="url(#mBook4)"/>
        <line x1="12" y1="35" x2="48" y2="35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
        <line x1="12" y1="45" x2="38" y2="45" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </g>

      <!-- Book 3 (Sky Blue, Open/Gilded top) -->
      <g transform="translate(200, 210)">
        <rect x="0" y="0" width="70" height="295" rx="6" fill="url(#mBook2)"/>
        <!-- Ribbon -->
        <path d="M35 0 L35 45 L42 38 L49 45 L49 0" fill="#f59e0b"/>
      </g>

      <!-- Book 4 (Indigo / Royal Purple, Centerpiece Tall) -->
      <g transform="translate(280, 160)">
        <rect x="0" y="0" width="85" height="345" rx="7" fill="url(#mBook5)"/>
        <circle cx="42" cy="50" r="14" fill="#ffffff" opacity="0.15"/>
        <line x1="20" y1="90" x2="65" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
        <line x1="20" y1="102" x2="52" y2="102" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </g>

      <!-- Book 5 (Rose Coral, Thick Book on Right) -->
      <g transform="translate(375, 185)">
        <rect x="0" y="0" width="80" height="320" rx="7" fill="url(#mBook3)"/>
        <rect x="15" y="40" width="50" height="60" rx="4" fill="#ffffff" opacity="0.12"/>
        <line x1="25" y1="62" x2="55" y2="62" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="25" y1="74" x2="45" y2="74" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
      </g>
    </g>

    <!-- Warm Glowing Base Line -->
    <line x1="40" y1="475" x2="472" y2="475" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Modern Gloss Reflection -->
  <rect x="20" y="20" width="472" height="200" rx="104" fill="#ffffff" opacity="0.03"/>
</svg>
